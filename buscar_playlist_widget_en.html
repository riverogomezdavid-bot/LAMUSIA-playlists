<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find my playlist</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap');

  #buscar-playlist-widget {
    --bp-accent: #C9A961;
    --bp-accent-soft: #E6D4A0;
    --bp-accent-dark: #A98A47;
    --bp-accent-text: #100C10;
    --bp-text: #EDE7DA;
    --bp-muted: #9C9689;
    --bp-border: rgba(237, 231, 218, 0.16);
    --bp-bg-input: #1B151D;
    --bp-bg-input-disabled: #141019;
    --bp-bg-info: rgba(96, 165, 250, 0.12);
    --bp-text-info: #93c5fd;
    --bp-bg-warn: rgba(248, 113, 113, 0.12);
    --bp-text-warn: #fca5a5;
    --bp-bg-ok: rgba(201, 169, 97, 0.14);
    --bp-text-ok: #E6D4A0;
    --bp-radius: 10px;
    --bp-font: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --bp-font-voice: 'Fraunces', serif;

    max-width: 420px;
    margin: 0 auto;
    font-family: var(--bp-font);
    color: var(--bp-text);
  }

  body { background: #100C10; }

  #buscar-playlist-widget .bp-logo {
    font-family: var(--bp-font-voice);
    font-optical-sizing: none;
    font-variation-settings: 'opsz' 28;
    font-size: 24px;
    text-align: center;
    margin-bottom: 24px;
    white-space: nowrap;
  }
  #buscar-playlist-widget .bp-logo .bp-logo-la {
    font-style: italic;
    font-weight: 500;
    color: var(--bp-accent-soft);
  }
  #buscar-playlist-widget .bp-logo .bp-logo-musia {
    font-weight: 600;
    color: var(--bp-text);
  }

  #buscar-playlist-widget .bp-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--bp-text);
  }

  #buscar-playlist-widget .bp-row {
    display: flex;
    gap: 8px;
  }

  #buscar-playlist-widget input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    font-size: 15px;
    background: var(--bp-bg-input);
    color: var(--bp-text);
    border: 1px solid var(--bp-border);
    border-radius: var(--bp-radius);
    outline: none;
    transition: border-color 0.15s ease;
  }

  #buscar-playlist-widget input[type="text"]::placeholder {
    color: var(--bp-muted);
  }

  #buscar-playlist-widget input[type="text"]:focus-visible {
    border-color: var(--bp-accent);
    box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.18);
  }

  #buscar-playlist-widget input[type="text"]:disabled {
    background: var(--bp-bg-input-disabled);
    color: var(--bp-muted);
  }

  #buscar-playlist-widget button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 20px;
    font-size: 15px;
    font-weight: 700;
    color: var(--bp-accent-text);
    background: var(--bp-accent);
    border: none;
    border-radius: var(--bp-radius);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease;
  }

  #buscar-playlist-widget button:hover:not(:disabled) {
    background: var(--bp-accent-dark);
  }

  #buscar-playlist-widget button:focus-visible {
    outline: 3px solid rgba(201, 169, 97, 0.4);
    outline-offset: 2px;
  }

  #buscar-playlist-widget button:disabled {
    background: var(--bp-muted);
    cursor: not-allowed;
  }

  #buscar-playlist-widget .bp-spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(16, 12, 16, 0.35);
    border-top-color: var(--bp-accent-text);
    border-radius: 50%;
    animation: bp-spin 0.7s linear infinite;
    display: none;
  }

  #buscar-playlist-widget button[data-loading="true"] .bp-spinner {
    display: inline-block;
  }

  @keyframes bp-spin {
    to { transform: rotate(360deg); }
  }

  #buscar-playlist-widget .bp-resultado {
    margin-top: 14px;
    padding: 0;
    font-size: 14.5px;
    line-height: 1.5;
    border-radius: var(--bp-radius);
  }

  #buscar-playlist-widget .bp-resultado:empty {
    display: none;
  }

  #buscar-playlist-widget .bp-resultado.bp-info {
    padding: 12px 14px;
    background: var(--bp-bg-info);
    color: var(--bp-text-info);
  }

  #buscar-playlist-widget .bp-resultado.bp-warn {
    padding: 12px 14px;
    background: var(--bp-bg-warn);
    color: var(--bp-text-warn);
  }

  #buscar-playlist-widget .bp-resultado.bp-ok {
    padding: 12px 14px;
    background: var(--bp-bg-ok);
    color: var(--bp-text-ok);
  }

  #buscar-playlist-widget .bp-resultado.bp-ok a {
    color: var(--bp-text-ok);
    font-weight: 700;
    text-decoration: underline;
  }

  @media (prefers-reduced-motion: reduce) {
    #buscar-playlist-widget .bp-spinner { animation: none; }
  }

  #buscar-playlist-widget .bp-later-note {
    margin-top: 10px;
    font-size: 13px;
    color: var(--bp-text-ok);
  }
  #buscar-playlist-widget .bp-later-note a {
    color: var(--bp-text-ok);
    font-weight: 700;
  }
</style>
</head>
<body>

<div id="buscar-playlist-widget">
  <div class="bp-logo"><span class="bp-logo-la">la</span><span class="bp-logo-musia">musia</span></div>
  <label class="bp-label" for="bp-input">Order number</label>
  <div class="bp-row">
    <input type="text" id="bp-input" placeholder="E.g. 12345" autocomplete="off" inputmode="numeric">
    <button id="bp-boton" type="button">
      <span class="bp-spinner" aria-hidden="true"></span>
      <span class="bp-boton-texto">Search</span>
    </button>
  </div>
  <div id="bp-resultado" class="bp-resultado" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';

  // ⚠️ Replace with the real URL of your deployed Web App (Deploy →
  // Manage deployments), ending in /exec.
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzZIfiK_G7Ub1KfV-3Hx-aYPKxqi441B_ORJLE1ZRn5jicp29-Pt6sg6dH2CRhgp_I_/exec';

  var TIMEOUT_MS = 15000;

  var input = document.getElementById('bp-input');
  var boton = document.getElementById('bp-boton');
  var botonTexto = boton.querySelector('.bp-boton-texto');
  var resultado = document.getElementById('bp-resultado');

  // URL of the separate page where the customer rates the playlist
  // later on, once they've listened to it. Adjust the filename/path if
  // you host it somewhere else.
  var VALORAR_URL = 'valorar_playlist_en.html';

  var jsonpCounter = 0;

  // JSONP (a <script> tag) is used instead of fetch() because Apps
  // Script Web Apps don't allow setting custom CORS headers, and fetch()
  // can fail with a CORS error depending on the browser/setup. JSONP
  // isn't subject to that restriction.
  function buscarPlaylist(playlistId) {
    return new Promise(function (resolve, reject) {
      var callbackName = 'bpCallback_' + Date.now() + '_' + (jsonpCounter++);
      var script = document.createElement('script');
      var finished = false;
      var timeoutId;

      function limpiar() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        clearTimeout(timeoutId);
      }

      timeoutId = setTimeout(function () {
        if (finished) return;
        finished = true;
        limpiar();
        reject(new Error('timeout'));
      }, TIMEOUT_MS);

      window[callbackName] = function (data) {
        if (finished) return;
        finished = true;
        limpiar();
        resolve(data);
      };

      script.onerror = function () {
        if (finished) return;
        finished = true;
        limpiar();
        reject(new Error('network_error'));
      };

      script.src = SCRIPT_URL +
        '?playlist_id=' + encodeURIComponent(playlistId) +
        '&callback=' + callbackName;

      document.body.appendChild(script);
    });
  }

  function setCargando(cargando) {
    boton.disabled = cargando;
    input.disabled = cargando;
    boton.setAttribute('data-loading', cargando ? 'true' : 'false');
    botonTexto.textContent = cargando ? 'Searching…' : 'Search';
  }

  function mostrarMensaje(texto, tipo) {
    var oldNote = document.querySelector('#buscar-playlist-widget .bp-later-note');
    if (oldNote) oldNote.parentNode.removeChild(oldNote);
    resultado.className = 'bp-resultado' + (tipo ? ' ' + tipo : '');
    resultado.textContent = texto;
  }

  function mostrarResultado(data) {
    if (!data || !data.status) {
      mostrarMensaje('We couldn\'t check your playlist right now. Please try again in a few minutes.', 'bp-warn');
      return;
    }

    switch (data.status) {
      case 'ready':
        resultado.className = 'bp-resultado bp-ok';
        resultado.textContent = 'Here\'s your playlist! ';
        var link = document.createElement('a');
        link.href = data.playlist_url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'Click here to open it';
        resultado.appendChild(link);

        var laterNote = document.createElement('p');
        laterNote.className = 'bp-later-note';
        var valorarLink = document.createElement('a');
        valorarLink.href = data.feedback_link || (VALORAR_URL + '?playlist_id=' + encodeURIComponent(input.value.trim()));
        valorarLink.textContent = 'here';
        laterNote.appendChild(document.createTextNode('Once you\'ve enjoyed it, let us know what you thought '));
        laterNote.appendChild(valorarLink);
        laterNote.appendChild(document.createTextNode(' — it really helps us 🙌'));
        resultado.parentNode.insertBefore(laterNote, resultado.nextSibling);
        break;

      case 'not_ready':
        mostrarMensaje(data.message || 'Your playlist isn\'t ready yet. Please try again later.', 'bp-info');
        break;

      case 'not_found':
        mostrarMensaje('We couldn\'t find any order with that number. Please check it\'s correct.', 'bp-warn');
        break;

      default:
        mostrarMensaje(data.message || 'Something went wrong. Please try again in a few minutes.', 'bp-warn');
    }
  }

  function onBuscarClick() {
    var playlistId = input.value.trim();

    if (!playlistId) {
      mostrarMensaje('Please enter your order number.', 'bp-warn');
      input.focus();
      return;
    }

    mostrarMensaje('', '');
    setCargando(true);

    buscarPlaylist(playlistId)
      .then(mostrarResultado)
      .catch(function () {
        mostrarMensaje('We couldn\'t check your playlist right now. Please try again in a few minutes.', 'bp-warn');
      })
      .then(function () {
        setCargando(false);
      });
  }

  boton.addEventListener('click', onBuscarClick);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') onBuscarClick();
  });

  // If arriving from a link with the order number already included
  // (e.g. sent by email once the waiting time has passed), it's
  // pre-filled and checked automatically, so the customer doesn't have
  // to type it in.
  var urlParams = new URLSearchParams(window.location.search);
  var prefill = urlParams.get('playlist_id');
  if (prefill) {
    input.value = prefill;
    onBuscarClick();
  }
})();
</script>

</body>
</html>
